# tmux.conf

# マウスのホイールでコピーモードに入る（既定は off で、ホイールが ↑↓ として
# bash に届き、履歴が動くだけになる）。ドラッグで選択、離すとコピー
set -g mouse on

# コピーモードは vi のキー: C-b [ で入り、v で選択、y でコピー、q で抜ける
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# コピーした内容を OSC 52 で端末のクリップボードへ（Termux・SSH 先でも）
set -g set-clipboard on

set -g history-limit 50000
# Esc の待ちを短くする（vim の Esc が遅れない）
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
