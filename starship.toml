"$schema" = 'https://starship.rs/config-schema.json'

# 左: ディレクトリ・git・言語環境 → 改行 → 入力記号
format = """
$username$hostname$directory$git_branch$git_state$git_status$python$rust$nodejs
$character"""

# 右: 実行時間・終了コード（bash では ble.sh が必要）
right_format = "$cmd_duration$status"

add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# SSH 接続時だけ user@host を表示
[username]
format = "[$user]($style)@"
style_user = "bold yellow"

[hostname]
format = "[$hostname]($style) "
style = "bold yellow"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"

[git_branch]
format = "[⎇ $branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"
deleted = "✘${count}"
stashed = "≡"

[python]
format = "[py $version( \\($virtualenv\\))]($style) "
style = "yellow"

[rust]
format = "[rs $version]($style) "
style = "red"

[nodejs]
format = "[node $version]($style) "
style = "green"

[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "yellow"

[status]
disabled = false
format = "[✘ $status]($style) "
style = "bold red"
